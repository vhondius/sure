# Builds main into ghcr.io/<owner>/sure:commodities
# so a Dockge stack can pull it (deploy/commodities/compose.yaml).
# Fork-only: not part of the upstream PR branch (feature/commodities).
name: Commodities image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sure:commodities
            ghcr.io/${{ github.repository_owner }}/sure:sha-${{ steps.tag.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
